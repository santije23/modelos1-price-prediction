project:
  name: "bike-demand"
  seed: 42

data:
  raw_path: "data/processed/bike_share_with_nans.csv"
  target: "cnt"
  leakage_columns:
    - casual
    - registered
  test_size: 0.2

features:
  cyclic_columns:
    - hr
    - mnth
  drop_columns:
    - instant
    - dteday
    - atemp

model:
  type: "RandomForestRegressor"
  params:
    n_estimators: 100
    max_depth: 15
    random_state: 42
    n_jobs: -1

output:
  models_dir: "fase-2/models"
