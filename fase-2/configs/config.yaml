project:
  name: "bike-demand-fase-2"
  seed: 42

data:
  raw_path: "data/raw/bike_share_hourly.csv"
  processed_path: "data/processed/bike_share_with_nans.csv"
  target: "cnt"
  leakage_columns: ["casual", "registered"]
  test_size: 0.2

features:
  cyclic_columns: ["hr", "mnth"]
  drop_columns: ["instant", "dteday"]

model:
  type: "RandomForestRegressor"
  params:
    n_estimators: 100
    max_depth: 15
    random_state: 42

output:
  model_path: "fase-2/models/model_v2.joblib"
  metrics_path: "fase-2/reports/metrics_v2.json"
